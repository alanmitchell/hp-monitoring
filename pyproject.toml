[project]
name = "hp-monitoring"
version = "0.1.0"
description = "Data Collection code for monitoring defrost cycles on Phil Kaluza air-to-water heat pump"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Pinned exactly: every machine that connects over Quack must run the same version.
    "duckdb==2.0.0",
    # DuckDB needs pytz to return TIMESTAMPTZ values to Python
    "pytz>=2026.6",
]

# Install only what a machine needs, e.g. `uv sync --extra analysis` on a laptop.
# On the mini-PC always use `uv sync --all-extras`: `uv sync` removes every
# extra the command does not name, which breaks the other services.
[project.optional-dependencies]
sensors = [
    "labjackpython>=2.3.0",
    "pyserial>=3.5",
]
camera = [
    "opencv-python-headless>=5.0.0.93",
]
analysis = []
web = [
    "fastapi>=0.163.1",
    "plotly>=7.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
hp-db = "heatpump.dbserver.main:main"
hp-sensors = "heatpump.sensors.main:main"
hp-camera = "heatpump.camera.capture:main"
hp-web = "heatpump.web.main:main"
hp = "heatpump.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv.build-backend]
module-name = "heatpump"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
