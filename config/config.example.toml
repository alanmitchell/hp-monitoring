# Example configuration for the heatpump package.
# Copy to config/config.toml (ignored by git) and edit.
# Settings will be added here as heatpump.common.config takes shape.

# ---------------------------------------------------------------------------
# hp-sensors
# ---------------------------------------------------------------------------
[sensors]
max_interval = 60        # default: store each channel at least this often (seconds)
flush_seconds = 2        # how often readings are written to the database
watchdog_seconds = 120   # exit (and let systemd restart) if a thread is stuck this long

# One [sensors.devices.<name>] table per device. Each device runs in its own thread.
#   driver           which driver reads it (see src/heatpump/sensors/devices/)
#   period           seconds between reads (not used by devices that stream data)
#   report_together  true = when one channel is stored, store all of them (matched pairs)
# Any other setting is passed to the driver.
[sensors.devices.demo]
driver = "fake"
period = 1

# One [sensors.devices.<name>.channels.<channel>] table per channel. The channel
# name must be unique across all devices; it becomes the sensor name in the database.
#   kind          "analog" (default) or "binary"
#   unit, location, description   stored in the sensors table
#   deadband      store a sample only when it differs from the last stored value by
#                 more than this. Leave out to store every sample. 0 = any change.
#   max_interval  overrides the default above
# Any other setting is passed to the driver.
[sensors.devices.demo.channels.demo_temp]
unit = "degC"
deadband = 0.5
cycle_seconds = 120      # fake driver: length of one sine-wave cycle

[sensors.devices.demo.channels.demo_switch]
kind = "binary"
deadband = 0
cycle_seconds = 30

# Energy Conservatory DG-700 pressure gauge (one channel, Pascals).
# The gauge is zeroed when the port is opened and every 6 hours after that.
# Find the port name with: ls /dev/serial/by-id/
#[sensors.devices.dg700]
#driver = "dg700"
#period = 10
#port = "/dev/serial/by-id/usb-Prolific_Technology_Inc._USB_2.0_To_COM_Device-if00-port0"
#auto_zero_seconds = 21600   # optional: change how often the gauge is re-zeroed
#
#[sensors.devices.dg700.channels.coil_pressure]
#unit = "Pa"
#location = "outdoor unit"
#description = "Pressure across the evaporator coil (DG-700)"

# LabJack U3-LV. The driver returns volts (analog) or 0/1 (digital); `transform`
# turns that into the value that is stored.
#   pin          AIN0-AIN15 = analog input, 0 to 2.44 V (AIN0-7 are the FIO0-7
#                terminals, AIN8-15 are EIO0-7). FIO0-7, EIO0-7, CIO0-3 = digital input.
#                A channel with no pin is computed only from other channels.
#   samples      analog: average this many readings (default 1)
#   long_settle  analog: true for high-resistance sources (default false)
#   transform    a formula. x is this channel's raw reading; other channels on
#                this device are referred to by name. Functions: thermistor, abs,
#                min, max, round, sqrt, exp, log, log10, sin, cos, tan, atan.
#   store        false = not stored, only used in other channels' formulas
#[sensors.devices.labjack]
#driver = "labjack_u3"
#period = 1
#
## Voltage across the thermistor dividers (LM4040 reference, 2.048 V)
#[sensors.devices.labjack.channels.therm_supply]
#pin = "AIN3"
#store = false
#
## Thermistor on the ground leg of a divider with a 10 kOhm fixed resistor.
## a, b, c are Steinhart-Hart coefficients that give degrees Rankine; the result is degrees F.
#[sensors.devices.labjack.channels.suction_temp]
#pin = "AIN0"
#unit = "degF"
#deadband = 0.2
#transform = "thermistor(x, therm_supply, r_fixed=10000, a=6.2736e-4, b=1.3006e-4, c=4.8753e-8, scale='rankine')"
#
## Digital input that reads 0 when the valve is energized
#[sensors.devices.labjack.channels.defrost_valve]
#pin = "FIO4"
#kind = "binary"
#deadband = 0
#transform = "1 - x"
